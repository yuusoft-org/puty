---
suite: AsyncCounter
mode: class
exportName: AsyncCounter
constructorArgs:
  - 10
---
case: supports async class methods and assertions
executions:
  - method: increment
    in:
      - 3
    out: 13
    asserts:
      - property: value
        op: eq
        value: 13
      - method: getValue
        in: []
        out: 13
      - method: increment
        in:
          - 2
        out: 15
