file: './store.js'
group: store
---
suite: createStore
exportName: createStore
---
case: test store methods without asserting return value
in:
  - { count: 0 }
# No 'out' field - skip return value assertion
executions:
  - method: getCount
    in: []
    out: 0
  - method: dispatch
    in: [{ type: 'INCREMENT' }]
    out: 1
  - method: getCount
    in: []
    out: 1
  - method: dispatch
    in: [{ type: 'INCREMENT', payload: 5 }]
    out: 6
  - method: getState
    in: []
    out: { count: 6 }
---
suite: createCounter
exportName: createCounter
---
case: counter factory without return assertion
in: [5]
# No out - focus on testing methods
executions:
  - method: getValue
    in: []
    out: 5
